# A trimmed pacman.conf
[options]
HoldPkg     = pacman glibc
Architecture = auto
IgnorePkg   = linux linux-headers
IgnorePkg   = firefox*   # trailing comment
#IgnorePkg  = commented-out
ParallelDownloads = 5

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

#[multilib]
#Include = /etc/pacman.d/mirrorlist

[my-local-repo]
Server = file:///srv/repo
